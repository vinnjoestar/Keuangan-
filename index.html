<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manajer Keuangan Pribadi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .glass {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }
    </style>
</head>
<body class="p-4 md:p-8 font-sans text-white">

    <!-- HALAMAN LOGIN -->
    <div id="login-page" class="flex flex-col items-center justify-center min-h-[80vh]">
        <div class="glass p-8 rounded-2xl shadow-xl max-w-md w-full text-center">
            <h1 class="text-3xl font-bold mb-6 text-white">KeuanganKu</h1>
            <p class="mb-8 text-gray-200">Kelola pengeluaran Anda dengan bantuan AI</p>
            <button id="btn-login" class="w-full bg-white text-gray-800 font-bold py-3 px-4 rounded-lg shadow hover:bg-gray-100 transition flex items-center justify-center gap-3">
                <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-6 h-6" alt="Google">
                Login dengan Google
            </button>
        </div>
    </div>

    <!-- HALAMAN DASHBOARD MAIN -->
    <div id="dashboard-page" class="hidden max-w-6xl mx-auto">
        <div class="glass rounded-xl p-4 mb-6 flex justify-between items-center shadow-lg">
            <div>
                <h2 class="text-xl font-bold text-white">Halo, <span id="user-name">Pengguna</span></h2>
                <p class="text-sm text-gray-200">Dashboard Keuangan Anda</p>
            </div>
            <button id="btn-logout" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-4 rounded-lg transition">
                Logout
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Kolom Kiri: Input & AI Scan -->
            <div class="md:col-span-1 space-y-6">
                <!-- Form Input Manual -->
                <div class="glass p-6 rounded-xl shadow-lg">
                    <h3 class="text-lg font-bold mb-4 text-white">Catat Pengeluaran</h3>
                    <form id="form-expense" class="space-y-4">
                        <div>
                            <label class="block text-sm mb-1 text-gray-100">Nominal (Rp)</label>
                            <input type="number" id="input-amount" required class="w-full p-2 rounded bg-white/50 border border-gray-300 text-gray-900 placeholder-gray-500 focus:outline-none focus:ring-2 focus:ring-blue-400">
                        </div>
                        <div>
                            <label class="block text-sm mb-1 text-gray-100">Kategori</label>
                            <select id="input-category" class="w-full p-2 rounded bg-white/50 border border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-400">
                                <option value="Makanan">Makanan</option>
                                <option value="Transportasi">Transportasi</option>
                                <option value="Belanja">Belanja</option>
                                <option value="Tagihan">Tagihan</option>
                                <option value="Lainnya">Lainnya</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm mb-1 text-gray-100">Keterangan</label>
                            <input type="text" id="input-note" class="w-full p-2 rounded bg-white/50 border border-gray-300 text-gray-900 focus:outline-none focus:ring-2 focus:ring-blue-400">
                        </div>
                        <button type="submit" class="w-full bg-blue-500 hover:bg-blue-600 text-white font-bold py-2 px-4 rounded transition">Simpan Data</button>
                    </form>
                </div>

                <!-- AI Scanner -->
                <div class="glass p-6 rounded-xl shadow-lg">
                    <h3 class="text-lg font-bold mb-2 text-white">Scan Struk (Gemini AI)</h3>
                    <p class="text-xs text-gray-200 mb-4">Unggah foto struk untuk mencatat otomatis</p>
                    <input type="file" id="input-file" accept="image/*" class="w-full text-sm text-gray-100 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-white file:text-blue-700 hover:file:bg-gray-100 mb-3">
                    <button id="btn-scan" class="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-2 px-4 rounded transition">Scan Sekarang</button>
                    <p id="scan-status" class="mt-3 text-sm text-yellow-200 font-semibold hidden">Memindai gambar, mohon tunggu...</p>
                </div>
            </div>

            <!-- Kolom Kanan: Grafik & Riwayat -->
            <div class="md:col-span-2 space-y-6">
                <!-- Grafik Batang Menyamping -->
                <div class="glass p-6 rounded-xl shadow-lg">
                    <h3 class="text-lg font-bold mb-4 text-white">Ringkasan Pengeluaran</h3>
                    <div class="relative h-64 w-full">
                        <canvas id="expenseChart"></canvas>
                    </div>
                </div>

                <!-- Tabel Riwayat -->
                <div class="glass p-6 rounded-xl shadow-lg overflow-hidden">
                    <h3 class="text-lg font-bold mb-4 text-white">Riwayat Transaksi</h3>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left text-sm text-white">
                            <thead class="bg-white/20">
                                <tr>
                                    <th class="p-3 rounded-tl">Tanggal</th>
                                    <th class="p-3">Kategori</th>
                                    <th class="p-3">Keterangan</th>
                                    <th class="p-3">Nominal</th>
                                    <th class="p-3 rounded-tr">Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="table-body" class="divide-y divide-white/20">
                                <!-- Data akan muncul di sini -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        // 1. IMPORT FIREBASE BERBASIS WEB (CDN)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        // 2. KONFIGURASI FIREBASE MILIK ANDA
        const firebaseConfig = {
            apiKey: "AIzaSyD-_Mpy6m5D_oVd74QQHzle2xWtFgvUz-8",
            authDomain: "keuangan-9ba73.firebaseapp.com",
            projectId: "keuangan-9ba73",
            storageBucket: "keuangan-9ba73.firebasestorage.app",
            messagingSenderId: "855927069603",
            appId: "1:855927069603:web:342337f73e631154ed1816",
            measurementId: "G-QT20HC646E"
        };

        // INISIALISASI FIREBASE
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        // 3. KONFIGURASI KUNCI GEMINI API (AI)
        const GEMINI_API_KEY = "AQ.Ab8RN6LaHzuQkMndmnV3LUV8yu2DoVQvhYCfrE6Diffo6WlHYg";

        // ================= LOGIKA APLIKASI =================
        let currentUser = null;
        let chartInstance = null;

        const loginPage = document.getElementById('login-page');
        const dashboardPage = document.getElementById('dashboard-page');
        const btnLogin = document.getElementById('btn-login');
        const btnLogout = document.getElementById('btn-logout');
        const userNameText = document.getElementById('user-name');
        
        const formExpense = document.getElementById('form-expense');
        const tableBody = document.getElementById('table-body');
        
        const btnScan = document.getElementById('btn-scan');
        const inputFile = document.getElementById('input-file');
        const scanStatus = document.getElementById('scan-status');

        // FITUR AUTENTIKASI
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loginPage.classList.add('hidden');
                dashboardPage.classList.remove('hidden');
                userNameText.innerText = user.displayName;
                loadData();
            } else {
                currentUser = null;
                loginPage.classList.remove('hidden');
                dashboardPage.classList.add('hidden');
            }
        });

        btnLogin.addEventListener('click', () => {
            signInWithPopup(auth, provider).catch(error => {
                alert("Error Login: " + error.message);
                console.error(error);
            });
        });

        btnLogout.addEventListener('click', () => {
            signOut(auth);
        });

        // FITUR DATABASE
        formExpense.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (!currentUser) return;

            const amount = document.getElementById('input-amount').value;
            const category = document.getElementById('input-category').value;
            const note = document.getElementById('input-note').value;

            try {
                const colRef = collection(db, "users", currentUser.uid, "transactions");
                await addDoc(colRef, {
                    amount: Number(amount),
                    category: category,
                    note: note,
                    timestamp: new Date().toISOString()
                });
                formExpense.reset();
                loadData();
            } catch (error) {
                console.error("Gagal menyimpan data", error);
                alert("Gagal menyimpan: " + error.message);
            }
        });

        async function loadData() {
            if (!currentUser) return;
            tableBody.innerHTML = '<tr><td colspan="5" class="p-3 text-center">Memuat data...</td></tr>';
            
            try {
                const colRef = collection(db, "users", currentUser.uid, "transactions");
                const q = query(colRef, orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);
                
                tableBody.innerHTML = '';
                const chartData = {};

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    const id = docSnap.id;
                    const dateObj = new Date(data.timestamp);
                    const formattedDate = dateObj.toLocaleDateString('id-ID');

                    if(chartData[data.category]) {
                        chartData[data.category] += data.amount;
                    } else {
                        chartData[data.category] = data.amount;
                    }

                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td class="p-3">${formattedDate}</td>
                        <td class="p-3">${data.category}</td>
                        <td class="p-3">${data.note}</td>
                        <td class="p-3">Rp ${data.amount.toLocaleString('id-ID')}</td>
                        <td class="p-3">
                            <button onclick="deleteData('${id}')" class="text-red-300 hover:text-red-500 underline text-sm">Hapus</button>
                        </td>
                    `;
                    tableBody.appendChild(tr);
                });

                if(querySnapshot.empty) {
                    tableBody.innerHTML = '<tr><td colspan="5" class="p-3 text-center">Belum ada transaksi.</td></tr>';
                }

                updateChart(chartData);
            } catch (error) {
                console.error("Gagal memuat data", error);
                tableBody.innerHTML = '<tr><td colspan="5" class="p-3 text-center text-red-300">Gagal memuat data. Cek Firestore Rules.</td></tr>';
            }
        }

        window.deleteData = async function(docId) {
            if(confirm("Yakin ingin menghapus data ini?")) {
                try {
                    await deleteDoc(doc(db, "users", currentUser.uid, "transactions", docId));
                    loadData();
                } catch (error) {
                    alert("Gagal menghapus: " + error.message);
                }
            }
        }

        // FITUR GRAFIK (BATANG MENYAMPING)
        function updateChart(dataObj) {
            const ctx = document.getElementById('expenseChart').getContext('2d');
            const sortedEntries = Object.entries(dataObj).sort((a, b) => b[1] - a[1]);
            const labels = sortedEntries.map(entry => entry[0]);
            const values = sortedEntries.map(entry => entry[1]);

            if (chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Total Pengeluaran (Rp)',
                        data: values,
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.7)', 'rgba(54, 162, 235, 0.7)',
                            'rgba(255, 206, 86, 0.7)', 'rgba(75, 192, 192, 0.7)',
                            'rgba(153, 102, 255, 0.7)'
                        ],
                        borderColor: 'rgba(255, 255, 255, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: {
                            ticks: {
                                color: 'rgba(255, 255, 255, 0.8)',
                                callback: function(value) {
                                    if(value >= 1000000) return 'Rp ' + (value/1000000) + 'jt';
                                    if(value >= 1000) return 'Rp ' + (value/1000) + 'rb';
                                    return value;
                                }
                            },
                            grid: { color: 'rgba(255, 255, 255, 0.1)' }
                        },
                        y: {
                            ticks: { color: 'rgba(255, 255, 255, 0.9)', font: { weight: 'bold' } },
                            grid: { display: false }
                        }
                    }
                }
            });
        }

        // FITUR AI SCANNER (GEMINI)
        btnScan.addEventListener('click', async () => {
            const file = inputFile.files[0];
            if (!file) {
                alert("Silakan pilih foto struk terlebih dahulu!");
                return;
            }

            scanStatus.classList.remove('hidden');
            scanStatus.innerText = "Memindai gambar, mohon tunggu...";
            btnScan.disabled = true;

            try {
                const base64Data = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onloadend = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });

                const promptText = `Ini adalah gambar struk. Ambil dua informasi: 
                1. Total nominal uang (hanya angkanya saja, tanpa Rp/titik).
                2. Kategori (Pilih persis salah satu: Makanan, Transportasi, Belanja, Tagihan, Lainnya).
                Format balasan harus persis seperti ini: NOMINAL|KATEGORI`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=AQ.Ab8RN6LaHzuQkMndmnV3LUV8yu2DoVQvhYCfrE6Diffo6WlHYg`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
        contents: [{
            parts: [
                { text: promptText },
                { inline_data: { mime_type: file.type, data: base64Data } }
            ]
        }]
    })
});

                if (!response.ok) throw new Error(`Status error: ${response.status}`);

                const resultData = await response.json();
                const aiText = resultData.candidates[0].content.parts[0].text.trim();
                
                const parts = aiText.split('|');
                if(parts.length >= 2) {
                    document.getElementById('input-amount').value = parseInt(parts[0].replace(/[^0-9]/g, ''));
                    document.getElementById('input-category').value = parts[1].trim();
                    document.getElementById('input-note').value = "Scan Otomatis AI";
                    scanStatus.innerText = "Berhasil dipindai! Silakan klik Simpan Data.";
                    scanStatus.classList.replace('text-yellow-200', 'text-green-300');
                } else {
                    throw new Error("Format AI tidak sesuai");
                }

            } catch (error) {
                console.error(error);
                scanStatus.innerText = "Gagal memindai: " + error.message;
                scanStatus.classList.replace('text-yellow-200', 'text-red-300');
            } finally {
                btnScan.disabled = false;
            }
        });
    </script>
</body>
</html>
